
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificado FUN - Prueba</title>

<!-- Bibliotecas -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #26152f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal {
    background: #fff8fc;
    color: #26152f;
    width: min(95%, 650px);
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

h2 {
    color: #75405e;
}

p {
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d9a4c4;
    border-radius: 8px;
    margin: 18px 0;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #bd6f9e;
    box-shadow: 0 0 0 3px rgba(217,138,184,0.15);
}

button {
    background: #d98ab8;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 13px 22px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
    transition: 0.2s;
}

button:hover {
    background: #bd6f9e;
    transform: translateY(-2px);
}

.volver {
    background: #76546b;
}

.volver:hover {
    background: #5d4054;
}

#resultado {
    display: none;
}

/* CONTENEDOR DEL CERTIFICADO */

#certificadoFinal {
    position: relative;
    width: 100%;
    max-width: 750px;
    margin: 20px auto;
    overflow: hidden;
    background: white;
}

#fondoCertificado {
    display: block;
    width: 100%;
    height: auto;
}

/* NOMBRE PERSONALIZADO */

#nombreCertificado {
    position: absolute;
    top: 53.5%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: center;
    font-family: Georgia, serif;
    font-size: 35px;
    color: #75405e;
    font-weight: normal;
    overflow-wrap: anywhere;
}

/* =====================================
   SWEETALERT - CHRISTMAS COQUETTE
===================================== */

.swal2-popup.modal-certificado-coquette {
    width: min(92vw, 680px) !important;
    padding: 28px 25px !important;
    border-radius: 25px !important;
    border: 2px solid #f2c8da !important;
    background:
        radial-gradient(circle at top left, #fff0f6, transparent 45%),
        linear-gradient(145deg, #fffaf7, #fff0f5) !important;
    box-shadow: 0 15px 45px rgba(105, 45, 75, 0.25) !important;
    font-family: Georgia, serif !important;
    overflow: hidden !important;
    position: relative;
}

/* Decoración superior */

.swal2-popup.modal-certificado-coquette::before {
    content: "🎀  ✧  ♡  ✧  🎀";
    display: block;
    color: #c77b9e;
    font-size: 23px;
    letter-spacing: 5px;
    margin-bottom: 12px;
}

/* Título */

.modal-certificado-coquette .swal2-title {
    color: #a65379 !important;
    font-family: Georgia, serif !important;
    font-size: 27px !important;
    font-weight: normal !important;
    padding: 0 10px !important;
}

/* Contenido */

.modal-certificado-coquette .swal2-html-container {
    color: #80566d !important;
    font-size: 15px !important;
    line-height: 1.6 !important;
    margin: 15px 0 !important;
}

/* Botones */

.modal-certificado-coquette .swal2-confirm {
    border: none !important;
    border-radius: 30px !important;
    padding: 12px 25px !important;
    font-family: Georgia, serif !important;
    font-size: 14px !important;
    background: linear-gradient(135deg, #e7a2c0, #c8759e) !important;
    color: white !important;
    box-shadow: 0 5px 12px rgba(190, 105, 145, 0.25);
}

.modal-certificado-coquette .swal2-confirm:hover {
    transform: translateY(-2px);
}

/* Adaptación a celulares */

@media (max-width: 500px) {

    .modal {
        padding: 20px 15px;
    }

    #nombreCertificado {
        font-size: 22px;
    }

    .swal2-popup.modal-certificado-coquette {
        padding: 22px 14px !important;
        border-radius: 20px !important;
    }

    .modal-certificado-coquette .swal2-title {
        font-size: 22px !important;
    }

    .modal-certificado-coquette::before {
        font-size: 18px;
    }

}

</style>
</head>

<body>

<div class="modal">

    <!-- ESTADO 1: FORMULARIO -->

    <section id="formulario">

        <h2>¡Tu certificado te espera! ♡</h2>

        <p>
            Escribe tu nombre para personalizar
            tu reconocimiento.
        </p>

        <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre..."
            maxlength="35"
            autocomplete="off"
        >

        <br>

        <button onclick="generarCertificado()">
            Generar mi certificado ♡
        </button>

    </section>

    <!-- ESTADO 2: CERTIFICADO -->

    <section id="resultado">

        <h2>¡Tu certificado está listo! ♡</h2>

        <p>
            Ya puedes guardar tu reconocimiento.
        </p>

        <div id="certificadoFinal">

            <img
                id="fondoCertificado"
                src="Img/certificado.jpg"
                alt="Certificado FUN"
            >

            <div id="nombreCertificado"></div>

        </div>

        <button onclick="descargarCertificado()">
            Descargar certificado ♡
        </button>

        <button class="volver" onclick="volverFormulario()">
            Volver
        </button>

    </section>

</div>


<script>

// ELEMENTOS

const campoNombre = document.getElementById("nombre");

const formulario = document.getElementById("formulario");

const resultado = document.getElementById("resultado");

const fondoCertificado = document.getElementById("fondoCertificado");

const nombreCertificado = document.getElementById("nombreCertificado");

const certificadoFinal = document.getElementById("certificadoFinal");


// GENERAR CERTIFICADO

function generarCertificado() {

    const nombre = campoNombre.value.trim();

    if (!nombre) {

        Swal.fire({
            title: "¡Un momentito! 🎀",
            text: "Por favor, escribe tu nombre.",
            confirmButtonText: "Entendido ♡",
            buttonsStyling: false,
            customClass: {
                popup: "modal-certificado-coquette"
            }
        });

        return;

    }

    // Comprobar que el fondo esté cargado

    if (!fondoCertificado.complete ||
        fondoCertificado.naturalWidth === 0) {

        Swal.fire({
            title: "¡Ups! ♡",
            text: "No se pudo cargar el certificado. Revisa Img/certificado.jpg",
            confirmButtonText: "Entendido ♡",
            buttonsStyling: false,
            customClass: {
                popup: "modal-certificado-coquette"
            }
        });

        return;

    }

    // Colocar el nombre

    nombreCertificado.textContent = nombre;

    // Ocultar formulario

    formulario.style.display = "none";

    // Mostrar certificado

    resultado.style.display = "block";

}


// DESCARGAR CERTIFICADO PNG

async function descargarCertificado() {

    if (typeof htmlToImage === "undefined") {

        Swal.fire({
            title: "¡Ups! ♡",
            text: "No se pudo cargar la biblioteca de descarga.",
            confirmButtonText: "Entendido ♡",
            buttonsStyling: false,
            customClass: {
                popup: "modal-certificado-coquette"
            }
        });

        return;

    }

    try {

        await document.fonts.ready;

        const imagen = await htmlToImage.toPng(
            certificadoFinal,
            {
                pixelRatio: 2,
                cacheBust: true
            }
        );

        const enlace = document.createElement("a");

        enlace.download = "Mi-certificado-FUN.png";

        enlace.href = imagen;

        enlace.click();

    }

    catch (error) {

        console.error("Error al generar PNG:", error);

        Swal.fire({
            title: "¡Ups! ♡",
            text: "No se pudo generar el certificado. Revisa la consola para conocer el error.",
            confirmButtonText: "Entendido ♡",
            buttonsStyling: false,
            customClass: {
                popup: "modal-certificado-coquette"
            }
        });

    }

}


// VOLVER AL FORMULARIO

function volverFormulario() {

    resultado.style.display = "none";

    formulario.style.display = "block";

    campoNombre.focus();

}

</script>

</body>
</html>
